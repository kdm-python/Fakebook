[project]
name = "fakebook-backend"
version = "0.1.0"
description = "Browser-based Python exercise runner"
readme = "README.md"
authors = [
    { name = "Kyle Marden", email = "demolaze@Mac.home" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "pydantic-settings>=2.7.0,<3.0",
    "uvicorn[standard]>=0.32.0,<1.0",
]

[project.scripts]
fakebook-backend = "backend.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.0,<1.0",
    "pytest>=8.3.0,<9.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
