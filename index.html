<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fakebook Python Exercise</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Pyodide -->
    <script
      src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js"
      integrity="sha384-Hcsv6LxK5rH9vVB+a/+cLJZR3kIIM2Y851r6waxy+9JInvSROiD1bTMk748pYdat"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <div class="title">Fakebook Python Exercise</div>

      <button id="runButton" disabled>Loading Python...</button>
    </header>

    <main>
      <section class="console-panel">
        <div class="panel-title">Console</div>

        <div class="console-window">
          <div id="consoleOutput"></div>

          <div id="inputArea" class="input-area hidden">
            <span id="inputPrompt"></span>

            <input
              type="text"
              id="userInput"
              autocomplete="off"
              spellcheck="false"
            />

            <button id="submitInput">Enter</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
